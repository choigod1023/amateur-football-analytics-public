<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>장면 비교 확인</title><link rel="stylesheet" href="/differences.css"><script src="/differences.js" defer></script></head>
<body><main>
<nav aria-label="검토 메뉴"><a href="/report">경기 보고서</a><a href="/players">선수 확인</a></nav>
<header><p class="eyebrow">추적 · 코칭 검토</p><h1>판단이 필요한 장면</h1><p>기존 답으로 해결되지 않은 장면만 모았습니다. 영상과 확대 사진을 확인하고, 분간하기 어렵다면 ‘판단 어려움’을 선택해 주세요.</p></header>
<section class="toolbar" aria-label="표시 설정"><p id="count" role="status">불러오는 중</p><label><input type="checkbox" id="answered"> 이전 기록도 보기</label><button id="refresh" type="button">목록 새로고침</button></section>

<footer>답은 별도로 보존합니다. 이 화면의 저장만으로 기존 분류를 바꾸거나 모델을 자동 학습하지 않습니다.</footer>
</main></body></html>
