<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>하프타임 보고서</title>
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/halftime.css">
</head>
<body class="match-day">
<main>
  <nav class="half-pick" id="half-pick" aria-label="전반 후반 고르기" hidden>
    <button class="ds-btn" type="button" id="half-1" aria-pressed="true">전반</button>
    <button class="ds-btn" type="button" id="half-2" aria-pressed="false">후반</button>
  </nav>
  <header class="score">
    <div class="teams"><span>우리</span><span class="num" id="score">- : -</span><span>상대</span></div>
    <div class="meta" id="status">보고서 만드는 중</div>
  </header>
  <section class="state" id="busy" aria-live="polite"><p id="busy-text">보고서 만드는 중 (보통 몇 초)</p><div class="progress" aria-hidden="true"><i></i></div></section>
  <div id="blocks"></div>
  <details class="card" id="old" hidden><summary>후반 시작 전에 확인할 것 · 글로 된 요약</summary><ol id="old-second"></ol><ul id="old-summary"></ul></details>
  <p class="foot">선수 위치만으로 정리한 관찰입니다(모델 판정). 공의 움직임은 보지 않았습니다. 장면의 설명은 영상으로 확인한 뒤에 씁니다.</p>
</main>
<script src="/halftime.js"></script>
<script src="/nav.js"></script>
</body>
</html>
