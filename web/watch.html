<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>라이브 감시</title>
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/watch.css">
</head>
<body class="match-day">
<main>
  <section class="clockline" role="status"><b data-match-clock>경기 전</b><span data-match-score>우리 - : - 상대</span></section>
  <section class="state" id="state" data-level="unknown">
    <h1 id="headline">확인 중</h1>
    <p id="detail"></p>
    <p class="small" id="meta"></p>
  </section>
  <section>
    <h2>멈춤 기록</h2>
    <table>
      <thead><tr><th>시작</th><th>원인</th><th>지속</th><th>복구</th></tr></thead>
      <tbody id="log"><tr><td colspan="4">아직 기록이 없습니다</td></tr></tbody>
    </table>
    <p class="small">시작 = 마지막으로 정상이던 시각</p>
  </section>
  <section>
    <h2>하프타임 보고서</h2>
    <p id="half">확인 중</p>
  </section>
</main>
<script src="/watch-banner.js"></script>
<script src="/watch.js"></script>
<script src="/match-clock.js"></script>
<script src="/nav.js"></script>
</body>
</html>
