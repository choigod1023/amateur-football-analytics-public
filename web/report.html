<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>영상 보고서</title>
<link rel="stylesheet" href="/report.css">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<header class="site-head">
  <a class="back" href="/start">‹ 전체 화면</a>
  <h1>영상 보고서</h1>
  <p>녹화 영상을 올리면 분석 영상과 글을 만듭니다.</p>
</header>
<div class="site-chips" id="health" role="status" aria-live="polite">
  <span class="chip" id="chip-worker">분석 컴퓨터 확인 중</span>
  <span class="chip" id="chip-queue">대기 0 · 진행 0</span>
  <span class="chip" id="chip-disk">저장공간 -</span>
</div>

<main class="layout">
  <section class="panel" aria-labelledby="new-title">
    <h2 id="new-title">새 보고서 만들기</h2>
    <p class="lead">선수 위치와 움직임으로 분석합니다. 공의 흐름은 판정하지 않습니다.</p>
    <form id="new-form" novalidate>
      <label class="field"><span>녹화 영상</span><input id="file" type="file" accept=".mp4,.mov,.mkv,.ts,.m4v,video/*"><small>mp4, mov, mkv, ts, m4v · 최대 4GB</small></label>
      <label class="field"><span>제목 <em>선택</em></span><input id="title" maxlength="60" placeholder="예: 11/11 전반"></label>
      <div class="grid2">
        <label class="field"><span>카메라</span><select id="camera"></select><small>경기장 보정을 마친 카메라</small></label>
        <label class="field"><span>구간 이름</span><input id="half" value="전반" maxlength="12"></label>
      </div>
      <div class="grid2">
        <label class="field"><span>분석할 팀</span><select id="team"><option value="B" data-team-name="B">팀 B (어두운 옷)</option><option value="A" data-team-name="A">팀 A (밝은 옷)</option></select></label>
        <label class="field"><span>그 팀의 공격 방향</span><select id="direction"><option value="1">화면 왼쪽에서 오른쪽</option><option value="-1">화면 오른쪽에서 왼쪽</option></select></label>
      </div>
      <div class="grid2">
        <label class="field"><span>분석 시작</span><input id="start" value="0:00" inputmode="numeric"><small>분:초 또는 초</small></label>
        <label class="field"><span>분석 끝</span><input id="end" value="20:00" inputmode="numeric"><small>영상 안의 시각</small></label>
      </div>
      <label class="field"><span>득점 시각 <em>선택</em></span><input id="goals" placeholder="예: 2:42, 9:11, 10:48"><small>적으면 득점 장면, 비우면 잘된 장면과 고칠 장면을 고릅니다.</small></label>
      <label class="field"><span>업로드 암호</span><input id="token" type="password" autocomplete="off"><small>관리자에게 받은 값입니다. 화면을 닫으면 지워집니다.</small></label>
      <button class="primary" id="send" type="submit">영상 올리고 분석 시작</button>
      <progress id="bar" value="0" max="100" hidden></progress>
      <p class="message" id="message" role="alert"></p>
    </form>
  </section>

  <section class="panel wide" aria-labelledby="jobs-title">
    <div class="panel-head"><h2 id="jobs-title">만든 보고서</h2><span class="muted" id="jobs-count"></span></div>
    <p class="muted">한 번에 하나씩 처리합니다. 영상 길이의 1.5~2배가 걸립니다.</p>
    <div class="jobs" id="jobs"></div>
    <p class="empty" id="empty" hidden>아직 만든 보고서가 없습니다. 영상을 올리면 여기에 생깁니다.</p>
    <div class="live" aria-label="경기 중 알림">
      <strong>경기 중 알림</strong>
      <span>경기 중에 나온 알림은 <a href="/alerts">알림 평가</a>에서 맞았는지 판정합니다.</span>
    </div>
  </section>
</main>

<dialog id="detail" aria-labelledby="detail-title">
  <div class="dialog-head"><h2 id="detail-title"></h2><button class="ghost" id="detail-close" type="button" aria-label="닫기">닫기</button></div>
  <p class="muted" id="detail-meta"></p>
  <video id="detail-video" controls preload="metadata" playsinline hidden></video>
  <div class="links" id="detail-links"></div>
  <article class="report-text" id="detail-text"></article>
  <details class="log" id="detail-log" hidden>
    <summary>처리 기록 (관리자용)</summary>
    <div class="log-tabs" id="log-tabs"></div>
    <pre id="log-body">업로드 암호를 넣은 뒤 단계를 고르면 기록이 보입니다.</pre>
  </details>
</dialog>
<script src="/report.js"></script>
<script src="/team-names.js"></script>
<script src="/nav.js"></script>
</body>
</html>
