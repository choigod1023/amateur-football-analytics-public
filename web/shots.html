<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>슛 표시</title>
<link rel="stylesheet" href="/shots.css">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<header class="site-head">
  <a class="back" href="/start">‹ 전체 화면</a>
  <h1>슛 표시</h1>
  <p>장면을 고르고, 그림에서 슛 위치를 누른 뒤 결과를 누릅니다.</p>
</header>
<p id="progress" class="progress" role="status">불러오는 중</p>
<main>
  <aside>
    <div class="filters">
      <label>경기 <select id="f-match"><option value="">전체</option></select></label>
      <label>팀 <select id="f-side"><option value="">전체</option><option value="ours">우리 공격</option><option value="theirs">상대 공격</option></select></label>
      <label class="check"><input type="checkbox" id="f-todo"> 표시 안 한 것만</label>
    </div>
    <ol id="list"></ol>
    <details id="extra"><summary>목록에 없는 슛 추가 (박스 밖 슛 등)</summary>
      <div class="extra-form">
        <label>경기 <select id="x-match"></select></label>
        <label>구간 <select id="x-half"><option>전반</option><option>후반</option></select></label>
        <label>경기 시각(분) <input id="x-minute" type="number" min="0" max="60" step="0.5" value="10"></label>
        <label>팀 <select id="x-side"><option value="ours">우리</option><option value="theirs">상대</option></select></label>
        <p class="note">그림에서 슛 위치를 누른 뒤 결과 단추를 누릅니다.</p>
        <div class="buttons" id="x-buttons"></div>
      </div>
    </details>
  </aside>
  <section id="detail" hidden>
    <h2 id="title"></h2>
    <div class="two">
      <div><video id="video" controls playsinline preload="metadata"></video><p class="note">박스에 들어가기 6초 전부터 8초 뒤까지입니다.</p></div>
      <div><svg id="pitch" viewBox="0 0 570 408" width="100%"></svg><p class="note" id="pitch-note">그림은 우리 골대가 왼쪽입니다. 슛이 나간 위치를 누릅니다.</p></div>
    </div>
    <p id="side-row" hidden>어느 팀의 슛입니까? <select id="side-pick"><option value="">고르세요</option><option value="ours">우리 팀</option><option value="theirs">상대 팀</option></select></p>
    <div class="buttons" id="buttons"></div>
    <p id="saved" class="saved" role="status"></p>
  </section>
</main>
<script src="/shots.js"></script>
<script src="/nav.js"></script>
</body>
</html>
