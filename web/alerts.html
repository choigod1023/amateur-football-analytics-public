<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>알림 평가</title>
<link rel="stylesheet" href="/report.css">
<link rel="stylesheet" href="/alerts.css">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<header class="site-head">
  <a class="back" href="/start">‹ 전체 화면</a>
  <h1>알림 평가</h1>
  <p>알림마다 맞음, 틀림, 쓸모없음 중 하나를 누릅니다.</p>
</header>
<div class="site-chips" role="status" aria-live="polite">
  <span class="chip" id="chip-total">알림 0개</span>
  <span class="chip" id="chip-done">평가 0개</span>
  <span class="chip" id="chip-useful">도움이 된 비율 -</span>
</div>

<main class="alerts-layout">
  <section class="filters-panel" aria-label="보기 고르기">
    <div class="filters">
      <label>보기 <select id="filter"><option value="open">평가 안 한 알림만</option><option value="all">모두</option><option value="ok">맞음</option><option value="wrong">틀림</option><option value="useless">맞지만 쓸모없음</option></select></label>
      <label>종류 <select id="kind"><option value="">전체</option></select></label>
      <label>경기 <select id="session"><option value="">전체</option></select></label>
    </div>
    <details class="stats-box">
      <summary>종류별 결과 보기</summary>
      <div class="table-scroll">
        <table class="stats" id="stats"><thead><tr><th>종류</th><th>알림</th><th>평가</th><th>맞음</th><th>틀림</th><th>쓸모없음</th><th>도움이 된 비율</th></tr></thead><tbody></tbody></table>
      </div>
    </details>
  </section>
  <section aria-label="알림 목록">
    <div class="cards" id="cards"></div>
    <p class="empty" id="empty" hidden>평가할 알림이 없습니다. 경기 중에 나온 알림이 여기에 쌓입니다.</p>
  </section>
</main>
<script src="/alerts.js"></script>
<script src="/nav.js"></script>
</body>
</html>
