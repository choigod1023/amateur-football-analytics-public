<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 팀 고르기</title>
<link rel="stylesheet" href="/site.css">
<style>
  /* One dark look with the other pages: the tokens of web/site.css. */
  :root { --card: var(--c-card); --ink: var(--c-text); --sub: var(--c-mute); --line: var(--c-line-2); --accent: var(--c-pitch); --ok: var(--c-pitch); --warn: var(--c-amber); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 1.2rem/1.5 var(--font); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.7rem; margin: 8px 0 4px; }
  p.sub { color: var(--sub); margin: 0 0 16px; }
  .groups { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .group { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 12px; }
  .group h2 { font-size: 1.3rem; margin: 0 0 8px; }
  .pics { display: flex; gap: 8px; }
  .pics img { height: 190px; max-width: 32%; object-fit: contain; background: #0003; border-radius: 6px; }
  button { font: inherit; font-size: 1.25rem; padding: 14px 20px; margin-top: 12px; width: 100%; border-radius: 10px; border: 2px solid var(--accent); background: var(--accent); color: var(--c-on-accent); font-weight: 900; cursor: pointer; }
  button.plain { background: transparent; color: var(--ink); border-color: var(--line); }
  #confirm { display: none; background: var(--card); border: 2px solid var(--accent); border-radius: 12px; padding: 16px; margin-top: 16px; }
  #confirm .row { display: flex; gap: 12px; } #confirm button { margin-top: 8px; }
  .note { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); margin: 12px 0; }
  .warn { color: var(--warn); } .good { color: var(--ok); font-weight: 700; }
  body { word-break: keep-all; }
  @media (max-width: 640px) { body { font-size: 1.05rem; } h1 { font-size: 1.4rem; } .groups { grid-template-columns: 1fr; } .pics img { height: 150px; } button { font-size: 1.1rem; padding: 12px 14px; } #confirm .row { flex-direction: column; gap: 0; } }
</style>
</head>
<body class="match-day">
<main>
  <h1>우리 팀은 어느 쪽입니까?</h1>
  <p class="sub">옷 색으로 나눈 두 묶음입니다. 우리 팀 쪽을 누르세요.</p>
  <div id="current" class="note" hidden></div>
  <div id="status" class="note">불러오는 중입니다.</div>
  <div class="groups" id="groups"></div>
  <div id="confirm"><div id="sentence"></div><div class="row"><button id="yes">맞습니다</button><button id="no" class="plain">다시 고르기</button></div></div>
  <p><button id="clear" class="plain" hidden>저장된 팀 색 지우기</button></p>
</main>
<script src="/team-select.js"></script>
<script src="/nav.js"></script>
</body>
</html>
